name: Build APK

# The Android SDK and Google's Maven repo are what a release build needs, and
# they are not reachable from every dev environment. This builds the APK on a
# runner that can see them: every push gets an artifact to sideload, and a
# v* tag additionally publishes it as the release the README links to.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish this build as, e.g. v1.1.0. Leave blank to just build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Check the poses build and nothing clips
        run: |
          npx esbuild scripts/verify-poses.ts --bundle --platform=node \
            --format=cjs --outfile=.verify.cjs --external:three
          node .verify.cjs

      - run: npx tsc --noEmit

      - name: Generate the android project
        run: npx expo prebuild --platform android --no-install

      # android/ is gitignored and regenerated by the step above, so anything
      # edited in gradle.properties by hand is gone by the time gradle runs and
      # the Expo template's default wins. Its default is all four ABIs, which
      # is a 109MB APK; the download this repo publishes is arm64-v8a, ~44MB,
      # which covers every Android phone from roughly 2016 onward. Pin it here
      # or the size silently triples.
      - name: Pin the ABI the release is built for
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' \
            android/gradle.properties
          grep '^reactNativeArchitectures' android/gradle.properties

      - name: Assemble the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name it firstrep.apk
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/firstrep.apk

      - uses: actions/upload-artifact@v4
        with:
          name: firstrep-apk
          path: dist/firstrep.apk

      # A build on the default branch is a release when app.json names a version
      # that has not been released yet — bumping the version is the deliberate
      # act, and it has to be bumped anyway or the APK installs as a downgrade.
      # Re-running an already-released version republishes nothing.
      - name: Is this version already out?
        id: ver
        if: github.ref == 'refs/heads/master' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.release_tag }}"
          [ -n "$tag" ] || tag="v$(node -p "require('./app.json').expo.version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released — leaving it alone."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/firstrep.apk
          generate_release_notes: true
